# XcodeGen manifest — run `xcodegen` in ios/ to (re)generate
# PrayerTeam.xcodeproj. The project file is generated, not committed; this
# manifest is the source of truth.
name: PrayerTeam
options:
  bundleIdPrefix: org.redemptionseattle
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  PrayerTeam:
    type: application
    platform: iOS
    sources:
      - PrayerTeam
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: PrayerTeam/Info.plist
      properties:
        CFBundleDisplayName: Prayer Team
        # Export compliance: the app implements no encryption of its own. It
        # only uses what iOS provides — TLS through URLSession and the
        # Keychain for the session — which is exempt. Declaring it here stops
        # App Store Connect asking on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Fraunces-300.ttf
          - Fraunces-400.ttf
          - Fraunces-500.ttf
        # Debug builds talk to the dev server over http://localhost.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: PrayerTeam/PrayerTeam.entitlements
      properties:
        # Development here; distribution signing swaps in production.
        aps-environment: development
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: org.redemptionseattle.prayerteam
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_VERSION: '5.10'
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PZMJ856J43
