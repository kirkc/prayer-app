# XcodeGen manifest — run `xcodegen` in ios/ to (re)generate
# PrayerTeam.xcodeproj. The project file is generated, not committed; this
# manifest is the source of truth.
name: PrayerTeam
options:
  bundleIdPrefix: org.redemptionseattle
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  PrayerTeam:
    type: application
    platform: iOS
    sources:
      - PrayerTeam
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: PrayerTeam/Info.plist
      properties:
        CFBundleDisplayName: Prayer Team
        UILaunchScreen: {}
        # Debug builds talk to the dev server over http://localhost.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.redemptionseattle.prayerteam
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_VERSION: '5.10'
        TARGETED_DEVICE_FAMILY: '1'
        # Set your team in Xcode → Signing & Capabilities on first open.
        CODE_SIGN_STYLE: Automatic
